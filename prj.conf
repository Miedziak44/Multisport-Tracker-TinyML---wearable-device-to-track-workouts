# ==============================================================================
# KONFIGURACJA PERYFERIÓW SPRZĘTOWYCH (IMU SENSOR)
# ==============================================================================
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_LOG=y
CONFIG_REGULATOR=y
CONFIG_LSM6DSL_TRIGGER_NONE=y

# ==============================================================================
# KONFIGURACJA STOSU BLUETOOTH LOW ENERGY (BLE)
# ==============================================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO_FIT_TRACKER"
CONFIG_BT_MAX_CONN=1

# Integracja profilu Nordic UART Service (NUS)
CONFIG_BT_NUS=y

# Zabezpieczenie buforów dla transferu 50Hz (MTU Optimization)
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# ==============================================================================
# ZARZĄDZANIE PAMIĘCIĄ RTOS (KRYTYCZNE DLA BLE)
# ==============================================================================
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=8192      # Zwiększony stos dla obliczeń tensorowych sieci
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096

# ==============================================================================
# WSPARCIE KOMPILATORA DLA C++ ORAZ PLATFORMY EDGE IMPULSE
# ==============================================================================
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_REQUIRES_FULL_LIBCPP=y